<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猫宝宝的时光机</title>
    <style>
        /* 全局背景与字体 */
        body { 
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%); 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            padding: 20px; margin: 0; 
            min-height: 100vh;
            color: #333;
        }
        h1 { text-align: center; color: #fff; text-shadow: 0 2px 10px rgba(255,107,157,0.8); margin-bottom: 30px; }

        /* 故事文字区域 - 玻璃卡片效果 */
        .story-section {
            max-width: 800px;
            margin: 0 auto 40px auto;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .chapter-title { color: #d6336c; font-size: 1.5rem; margin-bottom: 10px; border-bottom: 2px dashed rgba(214, 51, 108, 0.3); padding-bottom: 10px; }
        .chapter-text { line-height: 1.8; font-size: 1.05rem; color: #444; }
        
        /* 照片墙区域 */
        .gallery-title { text-align: center; color: #fff; margin: 40px 0 20px; font-size: 1.5rem; text-shadow: 0 2px 5px rgba(255,107,157,0.5); }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .photo-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            aspect-ratio: 1 / 1; 
        }
        .photo-item:hover { transform: scale(1.05); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* 全屏画廊模态框 */
        .gallery-modal {
            display: none; position: fixed; z-index: 10000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content {
            max-width: 90%; max-height: 80vh;
            border-radius: 10px; box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 20px; right: 40px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: #ff6b9d; }
        .nav-btn { cursor: pointer; position: absolute; top: 50%; width: auto; padding: 16px; margin-top: -22px; color: white; font-weight: bold; font-size: 30px; transition: 0.3s; user-select: none; }
        .nav-btn:hover { color: #ff6b9d; }
        .prev { left: 20px; } .next { right: 20px; }

        @media screen and (max-width: 600px) {
            .story-section { padding: 20px; }
            .prev { left: 10px; font-size: 20px; } .next { right: 10px; font-size: 20px; }
        }
        
        .back-btn { display: block; text-align: center; margin: 40px auto; color: #fff; text-decoration: none; background: rgba(255, 107, 157, 0.8); padding: 12px 30px; border-radius: 30px; width: fit-content; }
    </style>
</head>
<body>
    <h1>小猫宝宝的童年宝藏 💗</h1>
    
    <!-- 这里是文字故事部分 -->
    <div class="story-section">
        <div class="chapter-title">粉雕玉琢的小天使</div>
        <div class="chapter-text">
            “一出生，就注定是被爱包围的宝贝。”<br><br>
            小猫宝宝小小的一团，肉嘟嘟的小手和小脚丫，让人看一眼心都要化了。<br>
            真想穿越回去，捏捏那时候你软乎乎的小脸。<br>
           
        </div>
    </div>

    <!-- 如果还有第二章，可以复制上面这段 story-section 改文字 -->

    <div class="gallery-title">翻开时光相册 📸</div>
    
    <!-- 这里是照片墙网格 -->
    <div class="photo-grid">
        <div class="photo-item" onclick="openGallery(0)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/1.jpg.jpg" alt="1"></div>
        <div class="photo-item" onclick="openGallery(1)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/2.jpg.jpg" alt="2"></div>
        <div class="photo-item" onclick="openGallery(2)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/3.jpg.jpg" alt="3"></div>
        <div class="photo-item" onclick="openGallery(3)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/4.jpg.jpg" alt="4"></div>
        <div class="photo-item" onclick="openGallery(4)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/5.jpg.jpg" alt="5"></div>
        <div class="photo-item" onclick="openGallery(5)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/6.jpg.jpg" alt="6"></div>
        <div class="photo-item" onclick="openGallery(6)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/7.jpg.jpg" alt="7"></div>
        <div class="photo-item" onclick="openGallery(7)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/8.jpg.jpg" alt="8"></div>
        <div class="photo-item" onclick="openGallery(8)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/9.jpg.jpg" alt="9"></div>
        <div class="photo-item" onclick="openGallery(9)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/10.jpg.jpg" alt="10"></div>
        <div class="photo-item" onclick="openGallery(10)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/11.jpg.jpg" alt="11"></div>
        <div class="photo-item" onclick="openGallery(11)"><img src="https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/12.jpg.jpg" alt="12"></div>
    </div>

    <a href="./index.html" class="back-btn">⬅ 返回首页查收生日惊喜</a >

    <!-- 全屏画廊模态框 -->
    <div class="gallery-modal" id="galleryModal">
        <span class="close-btn" onclick="closeGallery()">&times;</span>
        <span class="nav-btn prev" onclick="changeImage(-1)">&#10094;</span>
        <img id="modalImg" class="modal-content" src="">
        <span class="nav-btn next" onclick="changeImage(1)">&#10095;</span>
    </div>

    <script>
        const images = [
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/1.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/2.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/3.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/4.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/5.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/6.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/7.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/8.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/9.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/10.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/11.jpg.jpg",
            "https://raw.githubusercontent.com/xxy421/prettysun-us/main/images/12.jpg.jpg"
        ];
        let currentIndex = 0;
        const modal = document.getElementById("galleryModal");
        const modalImg = document.getElementById("modalImg");
        function openGallery(index) { modal.style.display = "flex"; currentIndex = index; modalImg.src = images[currentIndex]; }
        function closeGallery() { modal.style.display = "none"; }
        function changeImage(step) {
            currentIndex += step;
            if (currentIndex >= images.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = images.length - 1;
            modalImg.src = images[currentIndex];
        }
        modal.onclick = function(e) { if (e.target === modal) { closeGallery(); } }
    </script>
</body>
</html>
